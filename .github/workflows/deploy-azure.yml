name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-pizzeria-production
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-pizzeria
  LOCATION: eastus
  ACR_NAME: cac7aa06a97facr
  CONTAINER_ENV: pizzas-los-herrera-env
  CONTAINER_ENV_FALLBACK: pizzas-los-herrera-env-wp
  APP_NAME: pizzas-los-herrera
  IMAGE_NAME: pizzeria-api
  STORAGE_ACCOUNT: pizzeriastorage9319
  FILE_SHARE: pizzeria-data
  STORAGE_NAME: pizzeria-data
  LOG_ANALYTICS_WORKSPACE: pizzas-los-herrera-logs

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify required providers
        run: |
          set -euxo pipefail
          for provider in Microsoft.App Microsoft.ContainerRegistry Microsoft.OperationalInsights; do
            state=$(az provider show --namespace "$provider" --query registrationState --output tsv)
            test "$state" = "Registered" || {
              echo "ERROR: $provider no está registrado (estado: $state). Un administrador debe registrarlo una vez en la suscripción."
              exit 1
            }
          done

      - name: Login to Azure Container Registry
        id: acr
        run: |
          set -euo pipefail
          ACR_USER=$(az acr credential show --name "$ACR_NAME" --query username --output tsv)
          ACR_PASSWORD=$(az acr credential show --name "$ACR_NAME" --query 'passwords[0].value' --output tsv)
          echo "$ACR_PASSWORD" | docker login "$ACR_NAME.azurecr.io" --username "$ACR_USER" --password-stdin
          echo "username=$ACR_USER" >> "$GITHUB_OUTPUT"

      - name: Build and push image from GitHub Actions
        run: |
          set -euxo pipefail
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME"
          docker build --tag "$IMAGE:${GITHUB_SHA}" --tag "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          az acr repository show \
            --name "$ACR_NAME" \
            --image "$IMAGE_NAME:${GITHUB_SHA}" \
            --output none
          IMAGE_DIGEST=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "$IMAGE_NAME:${GITHUB_SHA}" \
            --query digest \
            --output tsv)
          test -n "$IMAGE_DIGEST"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"

      - name: Create or update Container App
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          WHATSAPP_NUMBER: ${{ secrets.PIZZERIA_WHATSAPP }}
        run: |
          set -euo pipefail
          ADMIN_USER="${ADMIN_USER:-admin}"
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME@$IMAGE_DIGEST"
          DEPLOY_ENV="$CONTAINER_ENV"
          ACR_USER=$(az acr credential show --name "$ACR_NAME" --query username --output tsv)
          ACR_PASSWORD=$(az acr credential show --name "$ACR_NAME" --query 'passwords[0].value' --output tsv)

          if ! az containerapp env show \
            --name "$CONTAINER_ENV" \
            --resource-group "$RESOURCE_GROUP" \
            >/dev/null 2>&1; then
            az containerapp env create \
              --name "$CONTAINER_ENV" \
              --resource-group "$RESOURCE_GROUP" \
              --location "$LOCATION"
          fi

          TARGET_ENV_ID=$(az containerapp env show \
            --name "$CONTAINER_ENV" \
            --resource-group "$RESOURCE_GROUP" \
            --query id \
            --output tsv)

          if az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            >/dev/null 2>&1; then
            EXISTING_ENV_ID=$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.managedEnvironmentId \
              --output tsv)
            if test "$EXISTING_ENV_ID" != "$TARGET_ENV_ID"; then
              az containerapp delete \
                --name "$APP_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --yes
            fi
          fi

          az storage account create \
            --name "$STORAGE_ACCOUNT" \
            --resource-group "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --sku Standard_LRS \
            --kind StorageV2 \
            --https-only true \
            --min-tls-version TLS1_2 \
            --output none
          STORAGE_KEY=$(az storage account keys list \
            --resource-group "$RESOURCE_GROUP" \
            --account-name "$STORAGE_ACCOUNT" \
            --query '[0].value' \
            --output tsv)
          az storage share-rm create \
            --resource-group "$RESOURCE_GROUP" \
            --storage-account "$STORAGE_ACCOUNT" \
            --name "$FILE_SHARE" \
            --quota 5 \
            --output none

          if ! az containerapp env storage set \
            --name "$DEPLOY_ENV" \
            --resource-group "$RESOURCE_GROUP" \
            --storage-name "$STORAGE_NAME" \
            --azure-file-account-name "$STORAGE_ACCOUNT" \
            --azure-file-account-key "$STORAGE_KEY" \
            --azure-file-share-name "$FILE_SHARE" \
            --access-mode ReadWrite \
            --output none 2>/tmp/containerapp-env-storage.err; then
            cat /tmp/containerapp-env-storage.err >&2
            if grep -q "ExpressEnvironmentResourceNotSupported" /tmp/containerapp-env-storage.err; then
              DEPLOY_ENV="$CONTAINER_ENV_FALLBACK"
              az monitor log-analytics workspace create \
                --resource-group "$RESOURCE_GROUP" \
                --workspace-name "$LOG_ANALYTICS_WORKSPACE" \
                --location "$LOCATION" \
                --sku PerGB2018 \
                --output none
              LOG_WORKSPACE_ID=$(az monitor log-analytics workspace show \
                --resource-group "$RESOURCE_GROUP" \
                --workspace-name "$LOG_ANALYTICS_WORKSPACE" \
                --query customerId \
                --output tsv)
              LOG_WORKSPACE_KEY=$(az monitor log-analytics workspace get-shared-keys \
                --resource-group "$RESOURCE_GROUP" \
                --workspace-name "$LOG_ANALYTICS_WORKSPACE" \
                --query primarySharedKey \
                --output tsv)
              if ! az containerapp env show --name "$DEPLOY_ENV" --resource-group "$RESOURCE_GROUP" --output none 2>/dev/null; then
                az containerapp env create \
                  --name "$DEPLOY_ENV" \
                  --resource-group "$RESOURCE_GROUP" \
                  --location "$LOCATION" \
                  --enable-workload-profiles true \
                  --logs-workspace-id "$LOG_WORKSPACE_ID" \
                  --logs-workspace-key "$LOG_WORKSPACE_KEY" \
                  --output none
              fi
              az containerapp env storage set \
                --name "$DEPLOY_ENV" \
                --resource-group "$RESOURCE_GROUP" \
                --storage-name "$STORAGE_NAME" \
                --azure-file-account-name "$STORAGE_ACCOUNT" \
                --azure-file-account-key "$STORAGE_KEY" \
                --azure-file-share-name "$FILE_SHARE" \
                --access-mode ReadWrite \
                --output none
            else
              exit 1
            fi
          fi

          if az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            CURRENT_ENV_ID=$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.managedEnvironmentId \
              --output tsv)
            CURRENT_ENV_NAME="${CURRENT_ENV_ID##*/}"
            if [ "$CURRENT_ENV_NAME" != "$DEPLOY_ENV" ]; then
              az containerapp delete \
                --name "$APP_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --yes \
                --output none
              CREATE_APP=true
            else
              CREATE_APP=false
            fi
          else
            CREATE_APP=true
          fi

          if [ "$CREATE_APP" = false ]; then
            az containerapp registry set \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --server "$ACR_NAME.azurecr.io" \
              --username "$ACR_USER" \
              --password "$ACR_PASSWORD"

            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --set-env-vars \
                ADMIN_USER="$ADMIN_USER" \
                ADMIN_PASSWORD="$ADMIN_PASSWORD" \
                PIZZERIA_WHATSAPP="${WHATSAPP_NUMBER:-5350722776}" \
                DATABASE_URL="sqlite:///mnt/pizzeria-data/pizzeria.db?mode=rwc" \
                UPLOADS_DIR="/mnt/pizzeria-data/uploads"
          else
            az containerapp create \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$DEPLOY_ENV" \
              --image "$IMAGE" \
              --registry-server "$ACR_NAME.azurecr.io" \
              --registry-username "$ACR_USER" \
              --registry-password "$ACR_PASSWORD" \
              --ingress external \
              --target-port 8080 \
              --min-replicas 0 \
              --max-replicas 1 \
              --env-vars \
                ADMIN_USER="$ADMIN_USER" \
                ADMIN_PASSWORD="$ADMIN_PASSWORD" \
                PIZZERIA_WHATSAPP="${WHATSAPP_NUMBER:-5350722776}" \
                DATABASE_URL="sqlite:///mnt/pizzeria-data/pizzeria.db?mode=rwc" \
                UPLOADS_DIR="/mnt/pizzeria-data/uploads"
          fi

          APP_ID=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query id \
            --output tsv)
          az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --output json |
            jq \
              --arg image "$IMAGE" \
              --arg storage "$STORAGE_NAME" \
              --arg database_url "sqlite:///mnt/pizzeria-data/pizzeria.db?mode=rwc" \
              --arg uploads_dir "/mnt/pizzeria-data/uploads" '
                {
                  location: .location,
                  tags: (.tags // {}),
                  properties: {
                    managedEnvironmentId: .properties.managedEnvironmentId,
                    configuration: .properties.configuration,
                    template: .properties.template
                  }
                }
                | .properties.template.containers[0].image = $image
                | .properties.template.containers[0].env = ((.properties.template.containers[0].env // [])
                    | map(select(.name != "DATABASE_URL" and .name != "UPLOADS_DIR"))
                    + [{name: "DATABASE_URL", value: $database_url}, {name: "UPLOADS_DIR", value: $uploads_dir}])
                | .properties.template.containers[0].volumeMounts = ((.properties.template.containers[0].volumeMounts // [])
                    | map(select(.volumeName != "pizzeria-data"))
                    + [{volumeName: "pizzeria-data", mountPath: "/mnt/pizzeria-data"}])
                | .properties.template.volumes = ((.properties.template.volumes // [])
                    | map(select(.name != "pizzeria-data"))
                    + [{name: "pizzeria-data", storageName: $storage, storageType: "AzureFile"}])
              ' > /tmp/pizzeria-containerapp.json
          az rest \
            --method put \
            --url "https://management.azure.com${APP_ID}?api-version=2024-03-01" \
            --body @/tmp/pizzeria-containerapp.json \
            --output none

      - name: Smoke test deployment
        run: |
          set -euo pipefail
          FQDN=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "Application URL: https://$FQDN"
          curl --fail --retry 10 --retry-delay 5 "https://$FQDN/api/health"

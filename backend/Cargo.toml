[package]
name = "pizzeria-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sea-orm = { version = "1.0", features = ["sqlx-sqlite", "runtime-tokio-native-tls"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
multer = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
subtle = "2.6"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
tempfile = "3"

# Optimización para compilar sin símbolos de depuración pesados y ahorrar espacio en disco
[profile.dev]
debug = 0

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# No usar panic = "abort": un panic en un handler mataría todo el proceso
# y tumbaría el servicio. Con unwind, axum devuelve 500 solo ese request.